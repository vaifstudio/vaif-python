# Builds and tests the package on every supported Python version, and fails on
# any known vulnerability in its dependencies, at their newest and at their
# lowest allowed versions. Actions are pinned to full commit SHAs; the comment
# after each SHA names its release tag.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the package and development tools
        run: python -m pip install -e '.[dev]'
      - name: Unit tests
        run: python -m pytest -q
      - name: Lint, formatting and type check
        run: |
          python -m ruff check src tests
          python -m ruff format --check src tests
          python -m mypy
      - name: Fail on any known vulnerability in the installed dependencies
        run: |
          python -m pip freeze --exclude-editable > "$RUNNER_TEMP/installed.txt"
          python -m pip install 'pip-audit==2.10.1'
          python -m pip_audit --strict --no-deps --disable-pip --requirement "$RUNNER_TEMP/installed.txt"
      - name: Build and validate distribution metadata
        run: |
          python -m build
          python -m twine check --strict dist/*
      - name: Smoke test the installed wheel outside the source tree
        run: |
          wheel="$(ls dist/vaifstudio-*-py3-none-any.whl)"
          version="$(basename "$wheel" | cut -d- -f2)"
          python -m pip install --force-reinstall --no-deps "$wheel"
          cd "$RUNNER_TEMP"
          python -c 'import sys, vaifstudio; from vaifstudio import VaifClient, VaifConsoleOnlyError, RealtimeClient; from vaifstudio._generated import OPERATIONS; assert vaifstudio.__version__ == sys.argv[1], vaifstudio.__version__; assert len(OPERATIONS) > 500' "$version"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.python == '3.10'
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  lowest-dependencies:
    name: Lowest dependency versions, Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Resolve every dependency of the package at its lowest allowed version
        run: |
          python -m pip install 'uv==0.12.24'
          python -m uv pip compile pyproject.toml --resolution lowest-direct --python-version '${{ matrix.python }}' --no-header --output-file "$RUNNER_TEMP/lowest.txt"
          cat "$RUNNER_TEMP/lowest.txt"
      - name: Install them with the package and development tools
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install --requirement "$RUNNER_TEMP/lowest.txt"
          python -m pip check
      - name: Unit tests at the lowest versions
        run: python -m pytest -q
      - name: Fail on any known vulnerability at the lowest versions
        run: |
          python -m pip install 'pip-audit==2.10.1'
          python -m pip_audit --strict --no-deps --disable-pip --requirement "$RUNNER_TEMP/lowest.txt"
